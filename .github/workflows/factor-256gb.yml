# Fork build: Linux x86_64, Windows x64 and macOS arm64 packages with the 256 GB factor ceiling.
# GitHub-hosted runners only (the upstream release workflow's Blacksmith runners are not
# available on this fork). Does not sign or notarize; the macOS app is ad-hoc signed.
name: Factor cap 256 GB

on:
  workflow_dispatch:
    inputs:
      only:
        description: Which packages to build
        type: choice
        options:
          - all
          - macos
        default: all

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    if: inputs.only == 'all'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_DEB_VERSION: 3.8.0
      CARGO_GENERATE_RPM_VERSION: 0.21.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils lintian rpm
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: factor256-linux-x86_64
      - name: Generate THIRD-PARTY-LICENSES.txt
        run: cargo xtask licences
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install --locked --version "$CARGO_DEB_VERSION" cargo-deb
          cargo install --locked --version "$CARGO_GENERATE_RPM_VERSION" cargo-generate-rpm
      - name: Build and package
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64
    if: inputs.only == 'all'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: factor256-windows-x64
      - name: Generate THIRD-PARTY-LICENSES.txt
        run: cargo xtask licences
      - name: Build and package
        shell: pwsh
        run: ./packaging/windows/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: factor256-macos-aarch64
          cache-on-failure: true
      - name: Generate THIRD-PARTY-LICENSES.txt
        run: cargo xtask licences
      - name: Import the signing certificate (skipped without APPLE_CERTIFICATE)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build and package (ad-hoc signed, not notarized)
        run: packaging/macos/package.sh --arch aarch64
      - name: Remove the temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-aarch64
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux, windows]
    if: inputs.only == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          tag=v0.8.1-faer
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" --target "${GITHUB_SHA}" --title "FieldCraft 0.8.1 (256 GB factor, optional faer)" --notes "$(cat <<'EOF'
          Fork of [tangency-labs/fieldcraft](https://github.com/tangency-labs/fieldcraft) `develop` at 0.8.1, plus the 64-bit factor ceiling and an optional faer Cholesky.

          The implicit solver's `max_factor_entries` ceiling is **32 000 000 000** on 64-bit (256 GB of factor values, 8 bytes each). The default stays 400 000 000. 32-bit and the web build keep the upstream ceiling of 2 000 000 000, because that count does not fit in a 32-bit `usize`.

          Set it on one solve, for example `solve.static` with `{"max_factor_entries": 32000000000}`. This does not reserve the memory.

          Desktop and the command line can pass `{"factor": "faer"}` to factor the same nested-dissection matrix with faer's supernodal Cholesky. The default stays the deterministic native kernel. Indefinite LDLᵀ stays native. The browser build refuses `faer`. faer's rounding depends on the CPU and the thread count and is not bit-identical.

          - Linux x86_64: `.tar.gz`, `.AppImage`, `.deb`, `.rpm` (glibc 2.35+, Ubuntu 22.04). Unsigned.
          - Windows x64: `.zip` with `fieldcraft.exe` and `fieldcraft-cli.exe`. Unsigned.
          - macOS Apple silicon (arm64), when the runner accepts the job: `.dmg` and `fieldcraft-cli-*-macos-aarch64.zip`. Ad-hoc signed, not notarized. Gatekeeper blocks the first launch: right-click `FieldCraft.app` and choose **Open**, or run `xattr -dr com.apple.quarantine` on the app.
          EOF
          )" dist/*

  publish-macos:
    name: Add macOS arm64 to the release
    needs: [macos, release]
    if: always() && needs.macos.result == 'success' && (inputs.only == 'macos' || needs.release.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macos-aarch64
          path: dist
      - name: Upload onto the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          tag=v0.8.1-faer
          gh release upload "$tag" dist/* --clobber
